
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy 18th Mahim!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Poppins', sans-serif;
        background-color: #020617; /* slate-950 */
        overflow-x: hidden;
      }
      .glow-text {
        text-shadow: 0 0 10px rgba(168, 85, 247, 0.4), 0 0 20px rgba(168, 85, 247, 0.2);
      }
      .pulsate {
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); filter: brightness(1); }
        50% { transform: scale(1.05); filter: brightness(1.3); text-shadow: 0 0 30px #f43f5e; }
      }
      
      /* Panic Shake Animation */
      @keyframes intense-shake {
        0% { transform: translate(2px, 2px) rotate(0deg); }
        10% { transform: translate(-2px, -3px) rotate(-1deg); }
        20% { transform: translate(-4px, 0px) rotate(1deg); }
        30% { transform: translate(4px, 3px) rotate(0deg); }
        40% { transform: translate(2px, -2px) rotate(1deg); }
        50% { transform: translate(-2px, 3px) rotate(-1deg); }
        60% { transform: translate(-4px, 2px) rotate(0deg); }
        70% { transform: translate(4px, 2px) rotate(-1deg); }
        80% { transform: translate(-2px, -2px) rotate(1deg); }
        90% { transform: translate(2px, 3px) rotate(0deg); }
        100% { transform: translate(2px, -3px) rotate(-1deg); }
      }
      .shake-it {
        animation: intense-shake 0.15s infinite;
      }

      .cake-shiver {
        animation: shiver 0.5s infinite;
      }
      @keyframes shiver {
        0% { transform: translate(0,0); }
        25% { transform: translate(1px, -1px); }
        50% { transform: translate(-1px, 1px); }
        75% { transform: translate(1px, 1px); }
        100% { transform: translate(0,0); }
      }
    </style>
